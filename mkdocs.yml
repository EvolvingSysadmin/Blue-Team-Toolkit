site_name: Blue Team Toolkit
site_url: https://blueteam.ryanheavican.com/
site_description: Field reference for incident response, log analysis, forensics, and hardening
site_author: Ryan Heavican
repo_url: https://github.com/EvolvingSysadmin/Blue-Team-Toolkit
repo_name: EvolvingSysadmin/Blue-Team-Toolkit
edit_uri: edit/main/docs/
copyright: Copyright &copy; Ryan Heavican

exclude_docs: |
  SUMMARY.md

theme:
  name: material
  logo: assets/icon.png
  favicon: assets/icon.png
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.details

nav:
  - Home: index.md
  - Incident Response:
      - incident-response/index.md
      - Preparation: incident-response/preparation.md
      - Detection and Analysis: incident-response/detection-and-analysis.md
      - Containment, Eradication, and Recovery: incident-response/containment-eradication-recovery.md
      - Post-Incident Activity: incident-response/post-incident-activity.md
  - Threat Intelligence:
      - threat-intelligence/index.md
      - MITRE ATT&CK: threat-intelligence/mitre-attack.md
  - SIEM and Logs:
      - siem-and-log-analysis/index.md
      - Log Review Approach: siem-and-log-analysis/log-review-approach.md
      - Windows Event Logs: siem-and-log-analysis/windows-event-logs.md
      - Linux Logs: siem-and-log-analysis/linux-logs.md
      - Web Server Logs: siem-and-log-analysis/web-server-logs.md
      - Network Device Logs: siem-and-log-analysis/network-device-logs.md
      - Syslog: siem-and-log-analysis/syslog.md
      - Sysmon: siem-and-log-analysis/sysmon.md
      - Splunk: siem-and-log-analysis/splunk.md
      - DeepBlueCLI: siem-and-log-analysis/deepbluecli.md
  - Phishing and Email:
      - phishing-and-email/index.md
      - Email Fundamentals: phishing-and-email/email-fundamentals.md
      - Email Headers: phishing-and-email/email-headers.md
  - Network Analysis:
      - network-analysis/index.md
      - Network Commands: network-analysis/network-commands.md
      - Common Ports: network-analysis/common-ports.md
      - Nmap: network-analysis/nmap.md
      - Wireshark: network-analysis/wireshark.md
  - Endpoint Forensics:
      - endpoint-forensics/index.md
      - Evidence Handling: endpoint-forensics/evidence-handling.md
      - Forensic Workstation: endpoint-forensics/forensic-workstation.md
      - File Systems: endpoint-forensics/file-systems.md
      - File Metadata: endpoint-forensics/file-metadata.md
      - File Hashing: endpoint-forensics/file-hashing.md
      - Windows Artifacts: endpoint-forensics/windows-artifacts.md
      - Linux Artifacts: endpoint-forensics/linux-artifacts.md
      - Memory Artifacts: endpoint-forensics/memory-artifacts.md
      - Tools:
          - Autopsy: endpoint-forensics/tools/autopsy.md
          - Browser History Capturer: endpoint-forensics/tools/browser-history-capturer.md
          - Browser History Viewer: endpoint-forensics/tools/browser-history-viewer.md
          - ExifTool: endpoint-forensics/tools/exiftool.md
          - FTK Imager: endpoint-forensics/tools/ftk-imager.md
          - John the Ripper: endpoint-forensics/tools/john-the-ripper.md
          - JumpList Explorer: endpoint-forensics/tools/jumplist-explorer.md
          - KAPE: endpoint-forensics/tools/kape.md
          - PECmd: endpoint-forensics/tools/pecmd.md
          - Scalpel: endpoint-forensics/tools/scalpel.md
          - SIFT Workstation: endpoint-forensics/tools/sift-workstation.md
          - Steghide: endpoint-forensics/tools/steghide.md
          - Sysinternals: endpoint-forensics/tools/sysinternals.md
          - Volatility: endpoint-forensics/tools/volatility.md
          - Windows File Analyzer: endpoint-forensics/tools/windows-file-analyzer.md
          - Other Tools: endpoint-forensics/tools/other-tools.md
  - Malware Analysis:
